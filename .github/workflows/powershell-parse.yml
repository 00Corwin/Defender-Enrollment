name: PowerShell syntax check

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse all PowerShell files
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path . -Recurse -Include *.ps1,*.psm1 | ForEach-Object {
              $tokens = $null
              $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile(
                  $_.FullName,
                  [ref]$tokens,
                  [ref]$errors
              )
              if ($errors.Count -gt 0) {
                  Write-Host "Syntax errors in $($_.FullName)" -ForegroundColor Red
                  $errors | Format-Table -AutoSize
                  $failed = $true
              }
          }
          if ($failed) { exit 1 }
